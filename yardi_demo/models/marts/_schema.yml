version: 2

models:
  - name: fct_transactions
    description: >
      Analytics-ready transaction fact table.  One row per financial
      transaction (charge, payment, credit, adjustment) with all
      dimension attributes resolved via joins.  Incremental merge
      on transaction_id.

      Voided and reversed transactions are included (filter with
      is_voided = false and transaction_status != 'reversed' for
      clean financial reporting).

      Key measures: amount, tax_amount, total_amount, net_amount,
      running_balance, days_to_post.
    columns:
      - name: transaction_sk
        description: "dbt_utils surrogate key"
        tests:
          - unique
          - not_null

      - name: transaction_id
        description: "Natural PK from Yardi (TRANS.HMY)"
        tests:
          - unique
          - not_null

      - name: transaction_type
        description: "CHG / PMT / CR / ADJ"
        tests:
          - not_null
          - accepted_values:
              values: ['CHG', 'PMT', 'CR', 'ADJ']

      - name: transaction_date
        description: "Date the transaction occurred"
        tests:
          - not_null

      - name: amount
        description: >
          Signed transaction amount.  Positive for charges/adjustments,
          negative for payments/credits.
        tests:
          - not_null

      - name: property_id
        description: "FK to dim_properties"
        tests:
          - not_null

      - name: property_name
        description: "Denormalized property name for direct BI consumption"
        tests:
          - not_null

      - name: tenant_id
        description: "FK to dim_tenants"
        tests:
          - not_null

      - name: gl_account_id
        description: "FK to dim_gl_accounts"
        tests:
          - not_null

      - name: is_voided
        description: "True if voided; filter out for clean reporting"
        tests:
          - not_null

      - name: _dbt_loaded_at
        description: "Timestamp when this row was loaded/updated by dbt"
