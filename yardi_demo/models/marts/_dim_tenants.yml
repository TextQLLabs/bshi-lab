version: 2

models:
  - name: dim_tenants
    description: >
      Analytics-ready tenant dimension.  One row per tenant with property,
      unit, and lease attributes resolved and derived measures (tenure,
      delinquency, credit band, age) carried through.  Incremental merge on
      tenant_id using modified_at as the watermark.

      All statuses retained; filter is_current = true for active residents.
      Key measures: account_balance, deposit, credit_score, tenure_months.
      PII is masked (ssn_last4 only).
    columns:
      - name: tenant_sk
        description: "dbt_utils surrogate key"
        tests: [unique, not_null]
      - name: tenant_id
        description: "Natural PK from Yardi (TENANT.HMY)"
        tests: [unique, not_null]
      - name: property_id
        description: "FK to dim_properties"
        tests: [not_null]
      - name: tenant_status
        description: "current / former"
        tests:
          - not_null
          - accepted_values:
              values: ['current', 'former']
      - name: account_balance
        description: "Current tenant AR balance; negative = credit"
        tests: [not_null]
      - name: balance_status
        description: "delinquent / credit / clear"
        tests:
          - not_null
          - accepted_values:
              values: ['delinquent', 'credit', 'clear']
      - name: is_current
        description: "True for current (in-place) tenants"
        tests: [not_null]
      - name: _dbt_loaded_at
        description: "Timestamp when this row was loaded/updated by dbt"
