version: 2

models:
  - name: stg_yardi__properties
    description: >
      Cleaned property master from Yardi RAW.PROPERTY.  Renames Hungarian
      columns, casts DACQUIRED/DDISPOSED from mixed-format TEXT to DATE,
      restores leading-zero ZIPs, maps ITYPE to property_type, casts
      BACTIVE/BTAXEXEMPT to boolean, and masks the owner tax id.  Raw
      region signals (SREGION, LEGACY_REGION_CD) are intentionally left
      untouched here and conformed in int_yardi__properties.
      One row per property.
    columns:
      - name: property_id
        description: "Natural PK (source: PROPERTY.HMY)"
        tests: [unique, not_null]
      - name: property_code
        description: "Business key, e.g. PROP-100 (source: SCODE)"
        tests: [unique, not_null]
      - name: property_name
        description: "Property display name"
        tests: [not_null]
      - name: state_code
        description: "USPS state code; the trusted geographic anchor"
        tests: [not_null]
      - name: zip_code
        description: "5-char ZIP, left-padded to restore lost leading zeros"
      - name: property_type
        description: "Mapped from ITYPE (1=Residential, 2=Commercial, 3=Mixed Use)"
        tests:
          - accepted_values:
              values: ['Residential', 'Commercial', 'Mixed Use']
      - name: owner_tax_id_last4
        description: "PII-masked owner tax id (last 4 only)"
      - name: acquired_date
        description: "Parsed from mixed-format TEXT DACQUIRED"
      - name: is_active
        description: "Boolean from BACTIVE (0/1)"
        tests: [not_null]
      - name: is_tax_exempt
        description: "Boolean from BTAXEXEMPT (0/1)"
        tests: [not_null]
      - name: _stg_acquired_date_parse_failed
        description: "DQ flag: DACQUIRED non-empty but unparseable"
      - name: _stg_disposed_date_parse_failed
        description: "DQ flag: DDISPOSED non-empty but unparseable"
      - name: _stg_county_missing
        description: "DQ flag: SCOUNTY was NULL in source"
