version: 2

models:
  - name: stg_yardi__properties
    description: >
      Cleaned property dimension from Yardi RAW.PROPERTY.  Renames columns,
      restores leading-zero ZIP codes lost to numeric storage, decodes the
      ITYPE magic-number property type, parses the mixed-format DACQUIRED /
      DDISPOSED text dates, casts 0/1 flags to boolean, masks the owner tax
      id, and nullifies the zero-value owner FK.  One row per property.

      NOTE: region_reported (source SREGION) is UNRELIABLE -- it disagrees
      with the property's state for 14 of 20 rows in the current extract.
      A conformed `region` is derived from `state` in
      int_yardi__property_details; prefer that field for reporting.
    columns:
      - name: property_id
        description: "PK (source: PROPERTY.HMY)"
        tests:
          - unique
          - not_null

      - name: property_code
        description: "Human-readable property identifier (e.g. PROP-100)"
        tests:
          - unique
          - not_null

      - name: property_name
        description: "Property display name"
        tests:
          - not_null

      - name: property_type
        description: "Human-readable type decoded from ITYPE"
        tests:
          - not_null
          - accepted_values:
              values: ['Residential', 'Commercial', 'Mixed Use']

      - name: zip_code
        description: "5-char ZIP with leading zeros restored (e.g. '02101')"
        tests:
          - not_null

      - name: reported_total_units
        description: >
          ITOTALUNITS as reported by the property master.  Treated as
          authoritative for portfolio sizing; note RAW.UNIT is a partial
          sample in this extract and does not reconcile (see
          int_yardi__property_details._int_unit_count_mismatch).
        tests:
          - not_null

      - name: market_value
        description: "Current market valuation (MMARKETVALUE)"
        tests:
          - not_null

      - name: is_active
        description: "True when BACTIVE = 1"
        tests:
          - not_null

      - name: is_tax_exempt
        description: "True when BTAXEXEMPT = 1"
        tests:
          - not_null

      - name: region_reported
        description: >
          Raw SREGION.  UNRELIABLE (mismatches state for 70% of rows); kept
          for lineage/audit only.  Use the conformed `region` downstream.

      - name: owner_tax_id_masked
        description: "Owner tax id with all but the last 4 digits masked."

      - name: _stg_acquired_date_parse_failed
        description: >
          DQ flag: true when DACQUIRED was non-empty but unparseable by any
          of the 5 known date formats.

      - name: _stg_disposed_date_parse_failed
        description: >
          DQ flag: true when DDISPOSED was non-empty but unparseable by any
          of the 5 known date formats.
